# Intégration continue : lance la suite de tests rapide (faux LLM, sans clé API ni réseau vers le LLM).
# Les tests -m llm sont exclus par défaut via pyproject.toml.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    # Le projet annonce Python 3.11 et plus : les deux versions sont testées
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v5

      # Installe Python avec un cache pip basé sur les fichiers de dépendances
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Installe les dépendances de l'application et des tests
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Vérifie le style et les erreurs courantes (règles dans pyproject.toml)
      - name: Lint (ruff)
        run: ruff check .

      # Lance la suite rapide (sans les tests -m llm)
      - name: Lancer pytest
        run: pytest

  # Tests JavaScript de l'interface (node:test, sans dépendance), lancés une seule fois
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 22 : nécessaire pour les motifs de fichiers dans « node --test »
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Limite de durée : une boucle infinie dans l'affichage bloquerait sinon le job sans fin
      - name: Tests de l'interface
        timeout-minutes: 5
        run: node --test "tests/frontend/*.test.mjs"
